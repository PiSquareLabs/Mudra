<!doctype html>
<html lang="en">
<head>

<style>
:root{--bg:#fff;--text:#0b0c0e;--muted:#5c6470;--accent:#0d9488;--border:#e3e6eb}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;line-height:1.6}
main{max-width:1040px;margin:0 auto;padding:32px 24px 56px}
